name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pin to a version compatible with the Go 1.25 toolchain we set up in CI.
          # `latest` currently resolves to v2.13.x which requires Go >= 1.26 and breaks the job.
          version: v2.7.0
          args: --timeout=5m
