server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"

agent:
  name: "Code-Agent"
  max_steps: 20
  timeout_sec: 180
  token_budget: 32000
  workspace_root: "./workspace"
  # Primary orchestrator: self-built native Loop (works with mock or real LLM).
  # Opt into CloudWeGo Eino with orchestrator: "eino" (requires a real LLM key).
  orchestrator: "native"
  eino_stream: true
  # In-graph HITL: CheckPointStore + ResumeWithData (falls back to app-level resume)
  eino_graph_resume: true
  eino_checkpoint_dir: "./data/eino-checkpoints"
  # Predictive pre-compact: when the conversation window reaches this fraction
  # of token_budget, a background LLM summary is scheduled (async, non-blocking).
  # Range (0,1]; default 0.8 → summarize at 80% of budget.
  compact_threshold_ratio: 0.8

llm:
  provider: "openai_compatible"
  model: "deepseek-ai/DeepSeek-V3"
  # Set via environment variables: LLM_API_KEY, LLM_USE_MOCK
  api_key: "${LLM_API_KEY:-}"              # set LLM_API_KEY + LLM_USE_MOCK=false to use a real LLM
  api_base: "https://api.siliconflow.cn/v1"
  use_mock: false           # true → mock LLM (native Loop still runs)

database:
  type: "memory"   # mysql | memory — set mysql when docker compose up
  auto_migrate: true
  schema_path: "scripts/sql/01_schema.sql"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "code_agent"
    username: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-}"

redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379

rate_limit:
  enabled: true
  per_minute: 60

token_quota:
  enabled: true
  per_user_per_day: 2000000

storage:
  enabled: true
  endpoint: "http://127.0.0.1:9000"
  bucket: "code-agent"
  access_key: "${MINIO_ACCESS_KEY:-minioadmin}"
  secret_key: "${MINIO_SECRET_KEY:-minioadmin}"
  use_path_style: true
  local_fallback_dir: "./data/objects"

host:
  mode: "server"          # server | host
  prefer_host: false      # true: coding tools go to host-agent when online
  endpoint: "ws://127.0.0.1:8080/ws/host"

otlp:
  enabled: false          # docker compose jaeger: set true + endpoint localhost:4318
  endpoint: "localhost:4318"
  insecure: true
  service: "code-agent"

security:
  api_keys:
    - "${API_KEY:-dev-key}"
  path_sandbox: true
  default_confirm_write: true

mcp:
  enabled: true
  # 启动时加载的 mcp.json（VS Code / Claude Desktop 风格 {"mcpServers": {...}}）
  # config_file: "./mcp.json"

skills:
  enabled: true
  dir: "./skills"

hooks:
  enabled: true
  dir: "./hooks"

commands:
  dir: "./commands"

teams:
  enabled: true
  file: "./teams/default.yaml"

subagent:
  enabled: true
  max_concurrent: 3
  default_steps: 8

plugins:
  enabled: true
  directory: "./plugins"

logging:
  level: "info"
