# 本地依赖：MySQL + Redis + MinIO
services:
  mysql:
    image: mysql:8.0
    container_name: code-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: code_agent
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - code_agent_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: code-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - code_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: code-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - code_agent_minio:/data

  # 可选：自动建 bucket（首次 up 后执行一次即可）
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/code-agent || true;
      exit 0;
      "

volumes:
  code_agent_mysql:
  code_agent_redis:
  code_agent_minio:
