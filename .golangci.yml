version: "2"

run:
  timeout: 5m
  go: '1.25'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

linters-settings:
  errcheck:
    check-type-assertions: false
  revive:
    rules:
      - name: exported
        disabled: true

formatters:
  enable:
    - gofumpt

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
    - path: cmd/
      linters:
        - errcheck
  # 0 = unlimited: never hide issues behind a cap (silent misses are worse than noise)
  max-issues-per-linter: 0
  max-same-issues: 0
